<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <img src="./image/profile.png" class="profile" alt="Profile Image of Subodh Poudel">
        <h2 class="name">
            Subodh Poudel
        </h2>
        <p class="bio">
            I am a Professional Digital Marketer and Passionate IT student doing Full Stack Development too.
        </p>
        <h3 class="skill">
            Skill
        </h3>
        <ul class="skillname">
            <li>
                Meta Ads
            </li>
            <li>Google Ads
            </li>
            <li>Email Marketing
            </li>
            <li>HTML/CSS/Javascript</li>
        </ul>

        <ul class="social" >
            <p class="socialtitle">
                Social Media
            </p>
            <li>
                <a href="https://www.facebook.com/">
                    <i class="fa-brands fa-facebook"></i>
                </a>
            </li>
            <li>
                <a href="https://www.linkedin.com/">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </li>
        </ul>
        <a href="tel:+977..." class="contact">
           <span class="badge">Contact Me</span> 
        </a>
    </div>
</body>

</html>
