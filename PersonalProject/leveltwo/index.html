<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page for Travel Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <Header class="site-header">
        <div class="logo">
            <img src="./image/Gurukul_Logo_RGB-08-17.svg" alt="" class="brand-logo">
        </div>
        <nav class="main-nav">
            <ul class="nav-list">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#tour">Tour</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
        
        <!-- Call to Action (CTA) Button -->
        <a href="#book" class="btn-primary">Book a Trip</a>
    </Header>
    <main>
        <section class="herosection" id="home">
            <div class="herocontent">
                <h1>Discover Your Next Great Adventure</h1>
                <p>Explore breathtaking destinations, exclusive Packages, and unforgettable experience curated just for you.</p>
            </div>
            <div class="hero-actions">
                <a href="#tour" class="btn-primary btn-large">Explore Tours</a>
                <a href="#video" class="btn-secondary btn-large">Watch Video</a>
            </div>
        </section>
    </main>

</body>

</html>
