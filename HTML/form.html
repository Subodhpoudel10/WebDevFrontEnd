    <form action="">
        <label for="">Gender</label>
        <br>
        <label for="male">Male:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">Female:</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="other">Other:</label>
        <input type="radio" name="gender" id="other" value="other">
        <br>
        <button type="submit">Submit</button>
    </form>
    <form action="">
        <h3>Can you control your anger,sadness,happiness and noiseness?</h3>
        <label for="yes">Yes:</label>
        <input type="radio" name="check" id="yes" value="yes">
        <label for="no">No:</label>
        <input type="radio" name="check" id="no" value="no">
        <br>
        <button type="submit">Submit</button>
    </form>
    <br><br><br>
    <form action="">
    <label for="course">Course</label>
    <select name="course" id="course">
        <option value="" disabled selected>select your option</option>
        <option value="bsccist">BSc CSIT</option>
        <option value="bim" >BIM</option>
        <option value="bca">BCA</option>
        <option value="bit">BIT</option>
    </select>
    <button type="submit">Submit</button>
    </form>
    <form action="">
        <label name="range">Select Volumn Level:</label>
        <input type="range" 
        name="volumn" 
        min="10" 
        max="100" 
        step="5" 
        value="40">
        <button type="submit">Submit</button>
    </form>
    <br><br><br>
    <form action="">
        <label for="feedback">Give us FeedBack:</label>
        <textarea id="feedback" name="feedback" rows="5" cols="10" placeholder="Give your feedback here"></textarea>
        <button type="submit">submit</button>
    </form>
