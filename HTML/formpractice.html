<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
</head>
<body>
    <form action="">
        <h2>Registration From</h2>
        <div>
        <label for="fname">First Name:</label>
        <input type="text" name="fname" id="firstname" placeholder="First Name">
        <br><label for="lname">Lastname:</label>
        <input type="text" name="lname" id="lastname" placeholder="Last Name" >
        </div>
        <label for="">Please select gender</label>
        <select name="gender">
            <option value="male" name="gender">Male</option>
            <option value="female" name="gender">Female</option>
            <option value="other" name="gender">Other</option>
        </select>
        <br>
        <label for="checkbox">Do you agree to all terms of service?</label>
        <input type="checkbox" name="check" value="Yes" id="checkbox">
        <label for="">Yes,I agree</label>
        <br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
